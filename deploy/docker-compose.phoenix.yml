# Phoenix（Arize）自托管可观测栈 — 作为「路线 B 兜底」始终保留在仓库，不删除。
# 适用：现网没有共享 Phoenix 实例时，把本文件与 docker-compose.langfuse.yml 一并 -f 并入主栈启动（见 DEPLOYMENT.md §4.9）。
# 注意：web/grpc 端口不映射到主机，由 caddy 经 appnet 内网代理（:6006 / :4317 内部可达）；
#       路线 A（现网共用栈在跑）下本文件不并入，agent 经主机 LAN IP 连接共享实例。
# 第三方镜像来自 Harbor dockerhub 项目（REGISTRY_HUB=172.16.220.74:8333/dockerhub）。

services:
  phoenix:
    image: ${REGISTRY_HUB}/phoenix:19.1.0
    restart: unless-stopped
    depends_on:
      - phoenix-db
    environment:
      - PHOENIX_SQL_DATABASE_URL=${PHOENIX_SQL_DATABASE_URL}
      - PHOENIX_PORT=6006
      - PHOENIX_GRPC_PORT=4317
    networks: [appnet]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:6006/').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  phoenix-db:
    image: ${REGISTRY_HUB}/postgres:16.14
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PHOENIX_DB_USER}
      - POSTGRES_PASSWORD=${PHOENIX_DB_PASSWORD}
      - POSTGRES_DB=${PHOENIX_DB_NAME}
      - TZ=UTC
      - PGTZ=UTC
    volumes:
      - phoenix_pg_data:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  appnet:
    name: appnet

volumes:
  phoenix_pg_data:
