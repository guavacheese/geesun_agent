# 看板即代码（dashboard as code）：JSON 放 deploy/grafana/dashboards/，随栈自动加载。
# 改看板流程：改 JSON → commit/push → 目标机同步 deploy/ → start_stack.sh 重部署（无需 UI 操作）。
apiVersion: 1

providers:
  - name: geesun
    orgId: 1
    folder: Geesun
    type: file
    disableDeletion: false
    updateIntervalSeconds: 60
    allowUiUpdates: false   # 禁止 UI 手改（改了下次部署会丢），要改请改 JSON
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
