# ───────────────────────────────────────────────────────────
# geesun_agent_web（Next.js 前端）容器化 — 与主栈合并启动。
#
# 拓扑：
#   geesun-agent-web 与 geesun-agent 同处 appnet，内部 3000 不发布主机；
#   Caddy :80 按路径路由：/api/* → geesun-agent:8009（后端），其余 → geesun-agent-web:3000。
#   前端与后端同域（http://10.10.10.67/），浏览器无 CORS 问题。
#
# ⚠️ NEXT_PUBLIC_API_BASE 是 build-time 变量（Next.js 公共变量构建时内联），
#    在构建镜像时经 --build-arg 注入（见 build-push.sh build_push_web（旧名 sync_web）/ geesun_agent_web/Dockerfile），
#    本 compose 不传该变量，运行时改 .env 无效。
# ───────────────────────────────────────────────────────────
services:
  geesun-agent-web:
    image: ${REGISTRY_GEESUN}/geesun-agent-web:${WEB_TAG:-1.0.0}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks: [appnet]
    # Swarm 模式 depends_on 仅支持列表语法（无 condition，仅保证先创建）；
    # web 连不上 agent 时靠 restart 重试直至就绪
    depends_on: [geesun-agent]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

