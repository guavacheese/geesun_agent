# geesun_mcp_server 容器化部署（企业文件解密 MCP）
#
# 合并启动（在 deploy/ 目录）：
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml \
#                  -f docker-compose.phoenix.yml -f docker-compose.langfuse.yml up -d
#
# 设计要点：
#   - 与 geesun-agent 同处 appnet；agent 用服务名 geesun-mcp:8000 访问
#     （对应 .env 的 mcp_server_url=http://geesun-mcp:8000/mcp，覆盖默认的 localhost）。
#   - 容器内部端口 8000 不映射到主机，仅 appnet 内互访，
#     避免与 10.10.10.67 上现有 dev 的 :8000 冲突。
#   - 共享 agent 的 ${AGENT_DATA_ROOT}/{agent,uploads,reports} 挂载：
#     mcp 需读 skills（AGENT_WORKSPACE）、解析 /uploads / /reports 虚拟路径。
#   - E2B / CubeSandbox 访问需信任 egress CA（SSL_CERT_FILE），与 agent 同理（DEPLOYMENT §4.3）。
#   - DLP 解密网关（DECRYPT_API_URL）在 compose 外，由 .env 提供。
#   - 镜像需先由 build-push.sh 的 build_push_mcp()（旧名 sync_mcp）构建并推送（上下文 = geesun_mcp_server 仓库根）。
#
# ⚠️ 若 sandbox 代理未做 TLS 拦截(MITM)，可删掉下方 CA 挂载卷 + SSL_CERT_FILE 环境变量。

services:
  geesun-mcp:
    image: ${REGISTRY_GEESUN}/geesun-mcp-server:${MCP_TAG:-1.0.0}
    # 注入 deploy/.env 全部变量（DECRYPT_API_URL / E2B_* / mcp_token 等）
    env_file: [.env]
    environment:
      # 容器内路径（与 agent 挂载一致）
      AGENT_WORKSPACE: /data/agent
      UPLOAD_ROOT: /data/uploads
      REPORT_ROOT: /data/reports
      # CubeSandbox egress CA（容器内挂载路径，源见下方 CA_MOUNT_SRC 卷）
      SSL_CERT_FILE: /etc/ssl/certs/cube-root-ca.crt
    volumes:
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/agent:/data/agent
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/uploads:/data/uploads
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/reports:/data/reports
      # CubeSandbox egress CA：宿主机证书路径由 CA_MOUNT_SRC 指定（默认仓库内 certs/）。
      # 必须指向真实存在的文件；若 sandbox 代理无 MITM 则删除本行 + SSL_CERT_FILE。
      - ${CA_MOUNT_SRC:-../certs/cube-root-ca.crt}:/etc/ssl/certs/cube-root-ca.crt:ro
    networks: [appnet]
    healthcheck:
      # 仅确认 8000 在监听（streamable-http 的 /mcp 对 GET 语义不定，用 TCP 探活更稳）
      test: ["CMD", "python3", "-c", "import socket,sys; s=socket.create_connection(('127.0.0.1',8000),3); s.close(); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      endpoint_mode: dnsrr
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

