# Langfuse（LLM 观测）可观测栈 — 纳入 geesun swarm stack（start_stack.sh --with=langfuse 并入）。
#
# 自 2026-09-02 起与 Phoenix 一样「随栈自托管」，不再复用现网共享 Langfuse 实例：
#   原共享实例（langfuse-web / langfuse-worker / langfuse-postgres / langfuse-redis /
#   langfuse-clickhouse / langfuse-minio）占用主机 3000/3030/5432/6379/8123/9000/9091/9092，
#   与本栈抢端口且无人自愈。纳入 swarm stack 后由 deploy.restart_policy 自愈，
#   旧共享实例须停用（见下方「迁移注意」）。
#
# 拓扑：agent（appnet2）→ Langfuse OTLP ingest（langfuse-web:3000）落 trace；
#       langfuse-web/worker 经 appnet2 服务名访问 postgres / clickhouse / redis / minio。
#       仅 langfuse-web:3000（UI + OTLP）与 minio:9092（S3 媒体外部端点）发布主机，
#       其余后端（postgres / redis / clickhouse）仅 appnet2 内、不占主机端口。
#
# 镜像：langfuse / clickhouse-server / minio / redis / postgres 均来自 REGISTRY_HUB 所指项目
#       （生产单仓=geesun_ai；dockerhub proxy 模板示例不再使用），由 deploy/build-push.sh 同步进 Harbor。
#
# ⚠️ 迁移注意：启用本文件前，必须先停用现网共享 Langfuse 实例，释放主机
#   3000 / 9092（其余 3030/5432/6379/8123/9000/9091 共享实例占用但本栈不再发布，
#   仅 3000/9092 与本栈发布端口冲突）。否则 docker stack deploy 端口冲突起不来。
#   自托管 Langfuse 为全新空库，LANGFUSE_PUBLIC_KEY/SECRET_KEY 必须对应本实例项目
#   （最简易：用 LANGFUSE_INIT_PROJECT_PUBLIC_KEY/SECRET_KEY 填一组自选值，并把
#   LANGFUSE_PUBLIC_KEY/SECRET_KEY 设成完全相同的值，首次启动自动建项目）。

services:
  langfuse-worker:
    image: ${REGISTRY_HUB}/langfuse:${LANGFUSE_TAG:-3}
    # Swarm 模式 depends_on 仅支持列表语法（无 condition，仅保证先创建）
    depends_on: &langfuse-depends-on
      - postgres
      - minio
      - redis
      - clickhouse
    environment: &langfuse-worker-env
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      DATABASE_URL: ${DATABASE_URL}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: ${CLICKHOUSE_CLUSTER_ENABLED}
      LANGFUSE_USE_AZURE_BLOB: ${LANGFUSE_USE_AZURE_BLOB}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT}
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE}
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX}
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: ${LANGFUSE_S3_MEDIA_UPLOAD_BUCKET}
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: ${LANGFUSE_S3_MEDIA_UPLOAD_REGION}
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT}
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE}
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: ${LANGFUSE_S3_MEDIA_UPLOAD_PREFIX}
      LANGFUSE_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT}
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: ${LANGFUSE_S3_BATCH_EXPORT_ENABLED}
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: ${LANGFUSE_S3_BATCH_EXPORT_BUCKET}
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: ${LANGFUSE_S3_BATCH_EXPORT_PREFIX}
      LANGFUSE_S3_BATCH_EXPORT_REGION: ${LANGFUSE_S3_BATCH_EXPORT_REGION}
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_ENDPOINT}
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT}
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: ${LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_AUTH: ${REDIS_AUTH}
      LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: ${LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED}
      # V8 heap 上限锁 3 GB（默认 ~1.5 GB 会让 init/迁移在 4 GB 容器内仍先撞 V8 上限 OOM）。
      # 必须与 deploy.resources.limits.memory=4g 配套：单加此项则容器限 2g 时进程被内核 OOM-kill；
      # 单加 limit 不设此项则 V8 仍在 ~1.5 GB 崩溃（2026-09-03 实测：init scripts 跑一半 heap OOM，
      # organization 从未建成，UI 一直要求 New Organization）。
      NODE_OPTIONS: "--max-old-space-size=3072"
    networks: [appnet2]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          # 4 GB：web/worker 均运行 Prisma 迁移 + Next.js 服务（Node V8 heap 锁 3 GB 见上），
          # 2 GB 实测不足（2026-09-03 init 阶段 heap OOM，org 从未建成）。
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  langfuse-web:
    image: ${REGISTRY_HUB}/langfuse:${LANGFUSE_TAG:-3}
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
      # 关键：绑定 0.0.0.0。Next.js 默认只绑 overlay 网络 IP(10.0.1.x)，而 swarm
      # mode: host 发布经 docker-proxy 转发到容器 gwbridge IP(172.21.0.15)，该地址
      # 无监听 → 主机/agent 访问 10.10.10.67:3000 被 RST。绑 0.0.0.0 后两网段皆监听。
      HOSTNAME: "0.0.0.0"
    networks: [appnet2]
    # UI + OTLP ingest 发布主机 3000（mode: host 直绑，绕过 ingress mesh）：
    #   - 用户浏览器访问 http://10.10.10.67:3000
    #   - agent 经 .env 的 LANGFUSE_BASE_URL=http://10.10.10.67:3000 上报 trace
    #   - 注：默认 ingress 发布在崩溃循环期间 IPVS 残留失效后端导致主机不可达，
    #     故改用 mode: host（单节点 swarm 下稳定可靠）。
    ports:
      - target: 3000
        published: 3000
        mode: host
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  clickhouse:
    image: ${REGISTRY_HUB}/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    # 仅 appnet2 内（CLICKHOUSE_URL=http://clickhouse:8123 经服务名互访）；不发布主机端口
    networks: [appnet2]
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "2.0"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  minio:
    image: ${REGISTRY_HUB}/minio:chainguard
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # S3 API 发布主机 9092（浏览器经 LANGFUSE_S3_*_EXTERNAL_ENDPOINT=http://10.10.10.67:9092 取媒体）。
    # Console :9001 不发布（仅排障用，容器内可访问）。
    ports:
      - "9092:9000"
    volumes:
      - langfuse_minio_data:/data
    networks: [appnet2]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: ${REGISTRY_HUB}/redis:7
    command: >
      --requirepass ${REDIS_AUTH}
      --maxmemory-policy noeviction
    # 仅 appnet2 内（REDIS_HOST=redis 经服务名互访）；不发布主机端口
    volumes:
      - langfuse_redis_data:/data
    networks: [appnet2]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: ${REGISTRY_HUB}/postgres:${POSTGRES_VERSION:-17}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    # 仅 appnet2 内（DATABASE_URL=postgresql://postgres:...@postgres:5432/... 经服务名互访）；不发布主机端口
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks: [appnet2]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"


volumes:
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local
