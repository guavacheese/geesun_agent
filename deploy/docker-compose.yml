# 生产部署 — 主栈（geesun_agent + 依赖 + 反向代理 + 日志集中）
#
# 合并启动（在 deploy/ 目录）：
#   cp .env.example .env && vi .env        # 填全部密钥（含 REGISTRY_GEESUN / REGISTRY_HUB / Harbor 凭证）
#   ./start_stack.sh                          # 默认仅主栈（swarm）
#   ./start_stack.sh --with=mcp,web           # 并入 MCP / 前端
#   ./start_stack.sh --with=phoenix,langfuse  # 可观测栈随栈自托管（与 agent/mcp/web 统一启动）
#
# 说明：
#   - 镜像来自 Harbor：自有应用用 REGISTRY_GEESUN，第三方通用镜像用 REGISTRY_HUB；
#     生产单仓（2026-09-02 起）：两者同值 geesun_ai，全部服务同仓拉取，
#     由 deploy/build-push.sh 构建 / 同步（dockerhub proxy 仅作工作站手动拉官方镜像加速）。
#   - 多文件用 start_stack.sh --with= 合并 -c，共享 overlay 网络 appnet2（容器间用服务名互访，stack 前缀 geesun_）。
#   - 可观测性 Phoenix/Langfuse 均自托管、随栈启动：--with=phoenix 并入 docker-compose.phoenix.yml、
#     --with=langfuse 并入 docker-compose.langfuse.yml；二者都用 appnet2、由 deploy.restart_policy 自愈，
#     不再依赖现网共享实例。agent 经主机 LAN IP 连 Phoenix(:6006 UI，Alloy 转 :4317) 与
#     Langfuse(:3000 UI+OTLP)，见 .env 的 PHOENIX_COLLECTOR_ENDPOINT / LANGFUSE_BASE_URL。
#   - 对外只暴露 caddy 的 80（前端主入口）；数据库 / loki / grafana(127.0.0.1:3100) 不暴露到主机。
#   - 日志/指标/追踪：各服务 json-file 驱动做大小轮转（max-size/max-file），Alloy 统一采集（logs→Loki / metrics→Prometheus / traces→Phoenix，替代原 Promtail），Grafana 检索。
#   - geesun-agent 镜像需先由 build-push.sh 构建并推送（构建上下文必须为 /d/workspace）。
#   - CubeSandbox 证书（combined-ca）与 *.cube.app DNS：见 README `## Deployment` §0
#     与 deploy/setup-combined-ca.sh / deploy/setup-cube-dns.sh。

services:
  geesun-agent:
    # 自有应用镜像来自 Harbor geesun_ai 项目；构建/推送见 deploy/build-push.sh
    image: ${REGISTRY_GEESUN}/geesun-agent:${GEESUN_AGENT_TAG:-1.0.0}
    # 注入 deploy/.env 全部变量（base_url / openai_api_key / model_name /
    # agent_workspace / mcp_token / upload_root / report_root / E2B_* 等必填项
    # 仅靠上面 environment: 块无法覆盖，缺失会导致 config.py 校验失败容器起不来）
    env_file: [.env]
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      # 数据库（agent-postgres 服务名）
      POSTGRES_HOST: "${AGENT_PG_HOST:-agent-postgres}"
      POSTGRES_PORT: "${AGENT_PG_PORT:-5432}"
      POSTGRES_DB: "${AGENT_PG_DB:-agent_mem}"
      POSTGRES_USER: "${AGENT_PG_USER:-geesun}"
      POSTGRES_PASSWORD: "${AGENT_PG_PASSWORD}"
      # 追踪（复用现网共享实例，经主机 LAN IP 已发布端口连接；phoenix/langfuse 不在本 compose）
      phoenix_collector_endpoint: "${PHOENIX_COLLECTOR_ENDPOINT:-http://alloy:4317}"
      langfuse_base_url: "${LANGFUSE_BASE_URL:-http://10.10.10.67:3000}"
      langfuse_public_key: "${LANGFUSE_PUBLIC_KEY}"
      langfuse_secret_key: "${LANGFUSE_SECRET_KEY}"
      otel_project_name: "${OTEL_PROJECT_NAME:-Geesun-Agent-prod}"
      cors_allow_origins: "${CORS_ALLOW_ORIGINS:-http://10.10.10.67}"
      # CubeSandbox egress MITM CA：必须用 combined-ca.pem（mkcert+系统根 bundle），
      # 仅挂 rootCA.pem 单证书会整体替换信任库、排除系统根 → uv 拉 pypi UnknownIssuer
      # 启动即崩（2026-09-01 实测）。生成：宿主机 bash deploy/setup-combined-ca.sh。
      # 无 MITM 可删挂载+这两行。
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/combined-ca.pem
      SSL_CERT_FILE: /etc/ssl/certs/combined-ca.pem
      # 时区（全栈统一 UTC+8，国内部署）：
      # - geesun-agent 自身日志 ts 已在 src/core/logging.py:25,49 硬编码 UTC+8（与容器 TZ 无关）；
      #   此前"差 8 小时"的截图实为 Loki 容器自身日志（service_name=geesun_loki，容器 UTC，
      #   日志体 ts=...Z），Grafana UI 列按浏览器 UTC+8 渲染——属 UTC 容器常态分屏，非故障。
      # - agent 与下方各 infra 服务（loki/prometheus/alloy/grafana/caddy/node-exporter）统一设为
      #   Asia/Singapore（=UTC+8 无 DST），使现场读任意容器原始日志零时区转换。
      # - Singapore 与 Shanghai 数值等价、均无夏令时；中国机器语义上可改 Asia/Shanghai。
      #   统一走 ${TZ:-...} 变量，宿主设 TZ 即全局覆盖。
      TZ: "${TZ:-Asia/Singapore}"
    # 宿主机挂载：报告/上传/工作目录防容器重建丢失（AGENT_DATA_ROOT 见 .env）
    volumes:
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/agent:/data/agent
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/uploads:/data/uploads
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/reports:/data/reports
      # skills 三层目录（__system__/__agent__/__user_*__）——backend 路由 root_dir 依赖
      # /data/agent/skills 存在，缺失会 path_not_found（2026-09-02 实测）；挂宿主机侧持久化
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/skills:/data/agent/skills
      # CubeSandbox CA：挂载源见 .env 的 CA_MOUNT_SRC，由 deploy/setup-combined-ca.sh 生成
      # （mkcert+系统根 bundle，约 148 证书——不能只挂 rootCA.pem 单证书，原因见 .env.example 注释）
      - ${CA_MOUNT_SRC:-../certs/combined-ca.pem}:/etc/ssl/certs/combined-ca.pem:ro
    # Swarm 模式 depends_on 仅支持列表语法（无 condition，仅保证先创建）；
    # agent 连不上 postgres 时靠自身重试/重启直至就绪（等效等待 healthy）
    depends_on: [agent-postgres]
    networks: [appnet2]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8009/docs').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  agent-postgres:
    image: ${REGISTRY_HUB}/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${AGENT_PG_USER:-geesun}
      POSTGRES_PASSWORD: ${AGENT_PG_PASSWORD}
      POSTGRES_DB: ${AGENT_PG_DB:-agent_mem}
      # 时区与 geesun-agent 保持一致（Asia/Singapore / UTC+8），避免应用日志与 PG 会话时区错位
      TZ: "${TZ:-Asia/Singapore}"
      PGTZ: "${TZ:-Asia/Singapore}"
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    networks: [appnet2]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geesun -d agent_mem"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  caddy:
    image: ${REGISTRY_HUB}/caddy:2.8-alpine
    environment:
      TZ: "${TZ:-Asia/Singapore}"
    ports:
      # 仅主入口 :80（前端 + /api/* 路由）；Phoenix(:6006)/Langfuse(:3000) 由现网共享容器直出，
      # 不经 Caddy 代理（避免与它们的已发布端口冲突）。
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [appnet2]
    depends_on: [geesun-agent]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  loki:
    image: ${REGISTRY_HUB}/loki:3.2.0
    environment:
      TZ: "${TZ:-Asia/Singapore}"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [appnet2]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Grafana Alloy：统一采集 logs→Loki / metrics→Prometheus / traces→Phoenix（替代原 Promtail）──
  alloy:
    image: ${REGISTRY_HUB}/alloy:${ALLOY_TAG:-v1.19.2}
    environment:
      TZ: "${TZ:-Asia/Singapore}"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # env_file 注入 PHOENIX_OTLP_ENDPOINT（Alloy→Phoenix 转发目标；路线 A=LAN IP，路线 B=phoenix:4317）
    env_file: [.env]
    volumes:
      - ./alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    # 发布 UI 到主机 12345 便于调试；OTLP 4317/4321 仅在 appnet 内由 agent 访问（不发布主机）
    ports:
      - "12345:12345"
    networks: [appnet2]
    depends_on: [loki, prometheus]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Prometheus：自建 metrics 后端（接收 Alloy remote_write + 直抓 agent / Alloy 自身）──
  # 需 --web.enable-remote-write-receiver 才能接收 Alloy 的 prometheus.remote_write。
  prometheus:
    image: ${REGISTRY_HUB}/prometheus:${PROMETHEUS_TAG:-3.0}
    environment:
      TZ: "${TZ:-Asia/Singapore}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.rules.yml:/etc/prometheus/geesun-alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "19091:9090"
    networks: [appnet2]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── node-exporter：主机指标采集（CPU / 内存 / 磁盘 / 网络 / 负载）──
  # 职责：Grafana「主机概览」看板（uid geesun-host）的唯一数据源，提供 node_* 系列。
  # global 模式：每节点一份（当前单节点，将来加节点自动覆盖），不发布主机端口。
  #
  # 📜 历史背景（2026-09-03，勿当现状问题）：
  #   补此服务前 Prometheus 里 node_* 指标为 0——主机没有采集源，只能命令行 df/top 看。
  #   服务上线后 node_* 已正常入库，主机概览看板有值（当前状态），此段仅为变更动机存档。
  node-exporter:
    image: ${REGISTRY_HUB}/node-exporter:${NODE_EXPORTER_TAG:-v1.8.2}
    environment:
      TZ: "${TZ:-Asia/Singapore}"
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      # 排除容器/虚拟文件系统，否则 docker/overlay、kubelet 等伪盘刷屏
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/.+|rootfs/var/lib/containerd/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks: [appnet2]
    deploy:
      mode: global
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.2"
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── cAdvisor（容器级指标：每容器 CPU / 内存 / 网络 / 文件系统）──
  # 镜像来源（2026-09-04 实测修正：原 docker-compose.cadvisor.yml 已合并到本主栈）：
  #   ⚠️ 官方新版 cadvisor 不在 docker.io：cadvisor/cadvisor 仓库不存在；google/cadvisor 已冻结 7 年、
  #   仅支持 cgroups v1，在 67(cgroups v2) 必崩，禁用。
  #   官方发布在 gcr.io/cadvisor/cadvisor 与 ghcr.io/google/cadvisor。实测可达路径（构建机）：
  #     ghcr.io 直连：               docker pull ghcr.io/google/cadvisor:v0.57.0
  #     gcr.io 经 daocloud gcr 镜像站：docker pull gcr.m.daocloud.io/cadvisor/cadvisor:v0.57.0
  #   推入 Harbor（覆盖同名旧 tag，必须重推换 digest）：
  #     docker tag  ghcr.io/google/cadvisor:v0.57.0 172.16.220.74:8333/geesun_ai/cadvisor:v0.57.0
  #     docker push 172.16.220.74:8333/geesun_ai/cadvisor:v0.57.0
  #   硬性要求：必须 ≥v0.47（cgroups v2 支持；67 即 cgroup2fs / CgroupVersion=2）。
  #   旧版 google/cadvisor:latest（7 年前）在 cgroups v2 主机上必崩：
  #     "Failed to create a Container Manager: mountpoint for cpu not found"（exit 255 循环）。
  #   另：--docker_only=true 经 /var/run 内的 docker.sock 取容器指标，无需 privileged（Swarm 下
  #   privileged 顶层被忽略、deploy.privileged 部分版本 schema 拒绝，均不可用）。
  #
  # 部署：随主栈统一发布（变量由 start_stack.sh 从 .env 注入并展开）：
  #   ./start_stack.sh --no-build
  # 验证：
  #   docker service ps geesun_cadvisor --no-trunc | head
  #   docker service logs geesun_cadvisor | tail -20
  #
  # Grafana「容器概览」看板（geesun-containers）的数据源即本服务；
  # 历史曾拆出主栈（docker-compose.cadvisor.yml）以避开"构建机拉不到镜像阻塞主栈 deploy"，
  # 2026-09-04 合并回主栈：Harbor 已稳定持有 v0.57.0（ghcr.io/google/cadvisor 同步由 build-push.sh 完成），
  # 任何节点都能拉，无需再 --with=cadvisor 叠加；旧独立文件 docker-compose.cadvisor.yml 已删除。
  cadvisor:
    image: ${REGISTRY_HUB}/cadvisor:${CADVISOR_TAG:-v0.57.0}
    environment:
      TZ: "${TZ:-Asia/Singapore}"
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      # 2026-09-03 实测要点：Docker 29 默认启用 containerd snapshotter
      # （Storage Driver=overlayfs / io.containerd.snapshotter.v1），镜像层位于
      # /var/lib/containerd 而非传统 /var/lib/docker/overlay2。缺下面两行挂载，
      # cAdvisor 无法把容器 ID 映射成容器名，指标里 container=="" 导致看板全空。
      - /var/lib/containerd:/var/lib/containerd:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /dev/disk:/dev/disk:ro
    networks: [appnet2]
    deploy:
      mode: global
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: ${REGISTRY_HUB}/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      TZ: "${TZ:-Asia/Singapore}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # 看板 JSON 随代码进 git（dashboard as code），由 provisioning/dashboards/geesun.yaml 加载；
      # 禁止在 UI 里手改（allowUiUpdates=false），改了下次重部署会被覆盖。
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3100:3000"
    networks: [appnet2]
    depends_on: [loki, prometheus]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  appnet2:
    driver: overlay

volumes:
  agent_pg_data:
  caddy_data:
  caddy_config:
  loki_data:
  grafana_data:
  alloy_data:
  prometheus_data:
