# 生产部署 — 主栈（geesun_agent + 依赖 + 反向代理 + 日志集中）
#
# 合并启动（在 deploy/ 目录）：
#   cp .env.example .env && vi .env        # 填全部密钥（含 REGISTRY_GEESUN / REGISTRY_HUB / Harbor 凭证）
#   ./start_stack.sh                          # 默认仅主栈（swarm）
#   ./start_stack.sh --with=mcp,web           # 并入 MCP / 前端
#   ./start_stack.sh --with=phoenix,langfuse  # 路线 B 自托管兜底
#
# 说明：
#   - 镜像来自 Harbor：自有应用 geesun-agent 在 geesun_ai 项目（REGISTRY_GEESUN），
#     第三方通用镜像（pgvector/caddy/loki/alloy/prometheus/grafana）在 dockerhub 项目（REGISTRY_HUB），
#     由 deploy/build-push.sh 构建 / 同步。
#   - 多文件用 start_stack.sh --with= 合并 -c，共享 overlay 网络 appnet（容器间用服务名互访，stack 前缀 geesun_）。
#   - 可观测性复用现网共享实例（路线 A，默认）：Phoenix(:6006/:4317)、Langfuse(:3000) 由各自容器
#     已发布在主机，本 compose 不再跑 phoenix/langfuse 服务；agent 经主机 LAN IP 连接（见 .env）。
#   - 需要自托管兜底（无共享实例）时，把 docker-compose.langfuse.yml / docker-compose.phoenix.yml
#     一并 -f 并入（路线 B，见 DEPLOYMENT.md §4.9）；两文件始终保留在仓库，不删除。
#   - 对外只暴露 caddy 的 80（前端主入口）；数据库 / loki / grafana(127.0.0.1:3100) 不暴露到主机。
#   - 日志/指标/追踪：各服务 json-file 驱动做大小轮转（max-size/max-file），Alloy 统一采集（logs→Loki / metrics→Prometheus / traces→Phoenix，替代原 Promtail），Grafana 检索。
#   - geesun-agent 镜像需先由 build-push.sh 构建并推送（构建上下文必须为 /d/workspace）。
#   - CubeSandbox 证书与 *.cube.app DNS：见 DEPLOYMENT.md §4.3 / §4.8 与 deploy/setup-cube-dns.sh。

services:
  geesun-agent:
    # 自有应用镜像来自 Harbor geesun_ai 项目；构建/推送见 deploy/build-push.sh
    image: ${REGISTRY_GEESUN}/geesun-agent:${GEESUN_AGENT_TAG:-1.0.0}
    # 注入 deploy/.env 全部变量（base_url / openai_api_key / model_name /
    # agent_workspace / mcp_token / upload_root / report_root / E2B_* 等必填项
    # 仅靠上面 environment: 块无法覆盖，缺失会导致 config.py 校验失败容器起不来）
    env_file: [.env]
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      # 数据库（agent-postgres 服务名）
      POSTGRES_HOST: "${AGENT_PG_HOST:-agent-postgres}"
      POSTGRES_PORT: "${AGENT_PG_PORT:-5432}"
      POSTGRES_DB: "${AGENT_PG_DB:-agent_mem}"
      POSTGRES_USER: "${AGENT_PG_USER:-geesun}"
      POSTGRES_PASSWORD: "${AGENT_PG_PASSWORD}"
      # 追踪（复用现网共享实例，经主机 LAN IP 已发布端口连接；phoenix/langfuse 不在本 compose）
      phoenix_collector_endpoint: "${PHOENIX_COLLECTOR_ENDPOINT:-http://alloy:4317}"
      langfuse_base_url: "${LANGFUSE_BASE_URL:-http://10.10.10.67:3000}"
      langfuse_public_key: "${LANGFUSE_PUBLIC_KEY}"
      langfuse_secret_key: "${LANGFUSE_SECRET_KEY}"
      otel_project_name: "${OTEL_PROJECT_NAME:-Geesun-Agent-prod}"
      cors_allow_origins: "${CORS_ALLOW_ORIGINS:-http://10.10.10.67}"
      # CubeSandbox egress MITM CA（sandbox 出网 TLS 拦截证书，无 MITM 可删挂载+这两行）
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/cube-root-ca.crt
      SSL_CERT_FILE: /etc/ssl/certs/cube-root-ca.crt
    # 宿主机挂载：报告/上传/工作目录防容器重建丢失（AGENT_DATA_ROOT 见 .env）
    volumes:
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/agent:/data/agent
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/uploads:/data/uploads
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/reports:/data/reports
      # CubeSandbox CA（挂载源相对 deploy/ 目录，见 .env 的 CA_MOUNT_SRC）
      - ${CA_MOUNT_SRC:-../certs/cube-root-ca.crt}:/etc/ssl/certs/cube-root-ca.crt:ro
    depends_on:
      agent-postgres:
        condition: service_healthy
    networks: [appnet]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8009/docs').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  agent-postgres:
    image: ${REGISTRY_HUB}/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: ${AGENT_PG_USER:-geesun}
      POSTGRES_PASSWORD: ${AGENT_PG_PASSWORD}
      POSTGRES_DB: ${AGENT_PG_DB:-agent_mem}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geesun -d agent_mem"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  caddy:
    image: ${REGISTRY_HUB}/caddy:2.8-alpine
    ports:
      # 仅主入口 :80（前端 + /api/* 路由）；Phoenix(:6006)/Langfuse(:3000) 由现网共享容器直出，
      # 不经 Caddy 代理（避免与它们的已发布端口冲突）。
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [appnet]
    depends_on: [geesun-agent]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  loki:
    image: ${REGISTRY_HUB}/loki:3.2.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [appnet]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Grafana Alloy：统一采集 logs→Loki / metrics→Prometheus / traces→Phoenix（替代原 Promtail）──
  alloy:
    image: ${REGISTRY_HUB}/alloy:${ALLOY_TAG:-v1.19.2}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # env_file 注入 PHOENIX_OTLP_ENDPOINT（Alloy→Phoenix 转发目标；路线 A=LAN IP，路线 B=phoenix:4317）
    env_file: [.env]
    volumes:
      - ./alloy.config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    # 发布 UI 到主机 12345 便于调试（Swarm 不支持 host_ip，绑定所有接口）；OTLP 4317/4321 仅在 appnet 内由 agent 访问（不发布主机）
    ports:
      - target: 12345
        published: 12345
        mode: host
    networks: [appnet]
    depends_on: [loki, prometheus]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Prometheus：自建 metrics 后端（接收 Alloy remote_write + 直抓 agent / Alloy 自身）──
  # 需 --web.enable-remote-write-receiver 才能接收 Alloy 的 prometheus.remote_write。
  prometheus:
    image: ${REGISTRY_HUB}/prometheus:${PROMETHEUS_TAG:-3.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - target: 9090
        published: 9091
        mode: host
    networks: [appnet]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: ${REGISTRY_HUB}/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - target: 3000
        published: 3100
        mode: host
    networks: [appnet]
    depends_on: [loki, prometheus]
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  appnet:
    driver: overlay

volumes:
  agent_pg_data:
  caddy_data:
  caddy_config:
  loki_data:
  grafana_data:
  alloy_data:
  prometheus_data:
