# 生产部署 — 主栈（geesun_agent + 依赖 + 反向代理 + 日志集中）
#
# 合并启动（在 deploy/ 目录）：
#   cp .env.example .env && vi .env        # 填全部密钥（含 REGISTRY_GEESUN / REGISTRY_HUB / Harbor 凭证）
#   docker compose -f docker-compose.yml -f docker-compose.mcp.yml -f docker-compose.phoenix.yml -f docker-compose.langfuse.yml -f docker-compose.web.yml up -d
#
# 说明：
#   - 镜像来自 Harbor：自有应用 geesun-agent 在 geesun_ai 项目（REGISTRY_GEESUN），
#     第三方通用镜像（pgvector/caddy/loki/promtail/grafana）在 dockerhub 项目（REGISTRY_HUB），
#     由 deploy/build-push.sh 构建 / 同步。
#   - 多个 compose 用 -f 合并，共享默认网络 appnet（容器间用服务名互访）。
#   - 对外只暴露 caddy 的 18080 / 16006 / 13000（共享机方案 A 高端口映射）；数据库 / redis / clickhouse / minio(除 S3 19092) 不暴露到主机。
#   - 日志：各服务 json-file 驱动做大小轮转（max-size/max-file），Promtail 采集入 Loki，Grafana 检索。
#   - geesun-agent 镜像需先由 build-push.sh 构建并推送（构建上下文必须为 /d/workspace）。

services:
  geesun-agent:
    # 自有应用镜像来自 Harbor geesun_ai 项目；构建/推送见 deploy/build-push.sh
    image: ${REGISTRY_GEESUN}/geesun-agent:${GEESUN_AGENT_TAG:-1.0.0}
    restart: unless-stopped
    # 注入 deploy/.env 全部变量（base_url / openai_api_key / model_name /
    # agent_workspace / mcp_token / upload_root / report_root / E2B_* 等必填项
    # 仅靠上面 environment: 块无法覆盖，缺失会导致 config.py 校验失败容器起不来）
    env_file: [.env]
    environment:
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      LOG_FORMAT: "${LOG_FORMAT:-json}"
      # 数据库（agent-postgres 服务名）
      POSTGRES_HOST: "${AGENT_PG_HOST:-agent-postgres}"
      POSTGRES_PORT: "${AGENT_PG_PORT:-5432}"
      POSTGRES_DB: "${AGENT_PG_DB:-agent_mem}"
      POSTGRES_USER: "${AGENT_PG_USER:-geesun}"
      POSTGRES_PASSWORD: "${AGENT_PG_PASSWORD}"
      # 追踪（同网络内服务名）
      phoenix_collector_endpoint: "${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:4317}"
      langfuse_base_url: "${LANGFUSE_BASE_URL:-http://langfuse-web:3000}"
      langfuse_public_key: "${LANGFUSE_PUBLIC_KEY}"
      langfuse_secret_key: "${LANGFUSE_SECRET_KEY}"
      otel_project_name: "${OTEL_PROJECT_NAME:-Geesun-Agent-prod}"
      cors_allow_origins: "${CORS_ALLOW_ORIGINS:-http://10.10.10.67}"
    # 宿主机挂载：报告/上传/工作目录防容器重建丢失（AGENT_DATA_ROOT 见 .env）
    volumes:
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/agent:/data/agent
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/uploads:/data/uploads
      - ${AGENT_DATA_ROOT:-/opt/geesun/data}/reports:/data/reports
    depends_on:
      agent-postgres:
        condition: service_healthy
    networks: [appnet]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8009/docs').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  agent-postgres:
    image: ${REGISTRY_HUB}/pgvector:0.8.0-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AGENT_PG_USER:-geesun}
      POSTGRES_PASSWORD: ${AGENT_PG_PASSWORD}
      POSTGRES_DB: ${AGENT_PG_DB:-agent_mem}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - agent_pg_data:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geesun -d agent_mem"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  caddy:
    image: ${REGISTRY_HUB}/caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # 共享生产机方案 A：主机 80/3000 已被现有系统占用，Caddy 改映射高端口；
      # 容器内仍监听 80/6006/3000（Caddyfile 不变），仅 host 侧映射调整。
      - "18080:80"    # 前端主入口
      - "16006:6006"  # Phoenix
      - "13000:3000"  # Langfuse
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [appnet]
    depends_on: [geesun-agent]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  loki:
    image: ${REGISTRY_HUB}/loki:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks: [appnet]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  promtail:
    image: ${REGISTRY_HUB}/promtail:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yaml
    volumes:
      - ./promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks: [appnet]
    depends_on: [loki]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: ${REGISTRY_HUB}/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3100:3000"
    networks: [appnet]
    depends_on: [loki]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  appnet:
    name: appnet
    driver: bridge

volumes:
  agent_pg_data:
  caddy_data:
  caddy_config:
  loki_data:
  grafana_data:
