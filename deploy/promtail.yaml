server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      # 容器名 → container 标签
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # 仅采集 appnet 网络内的服务日志（过滤掉无关容器）
      - source_labels: ['__meta_docker_network_name']
        regex: 'appnet'
        action: keep
    pipeline_stages:
      # Docker json-file 驱动输出已是 JSON 行，提取结构化字段
      - docker: {}
      - json:
          expressions:
            level: level
            logger: logger
            msg: msg
            ts: ts
      - labels:
          level:
          logger:
