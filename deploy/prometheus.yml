global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Alloy 自身健康指标（采集器可观测性）
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  # agent 指标已走 OTLP（agent → alloy:4317 → remote_write），
  # 不暴露 /metrics 端点，无需直接抓取（此前每 10s 一条 404 噪音）
