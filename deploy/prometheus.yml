global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则（node-exporter/cadvisor 数据源；geesun.rules 维护于 prometheus.rules.yml）
rule_files:
  - /etc/prometheus/geesun-alerts.yml

scrape_configs:
  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Alloy 自身健康指标（采集器可观测性）
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  # 主机指标（node-exporter，overlay 内 :9100，不发布主机端口）
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # 容器指标（cadvisor，overlay 内 :8080，不发布主机端口）
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # agent 指标已走 OTLP（agent → alloy:4317 → remote_write），
  # 不暴露 /metrics 端点，无需直接抓取（此前每 10s 一条 404 噪音）。
  # 2026-09-04：agent 侧已补 MeterProvider + FastAPIInstrumentor + gen_ai 自研打点
  # （commit 5b476e3），镜像重建部署后 http_server_*/gen_ai_* series 将 15s 内出现。
