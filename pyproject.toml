[project]
name = "geesun-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "arize-phoenix-otel>=0.9.0",
    "deepagents>=0.5.3,<0.7",
    "fastapi>=0.137.1",
    "grandalf>=0.8",
    "langchain>=1.2.15",
    "langchain-cubesandbox",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.1",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "ldap3>=2.9.1",
    "openai>=2.32.0",
    "openinference-instrumentation-langchain>=0.1.0",
    # FastAPI HTTP server metrics（http_server_*）+ HTTP server span：与 langchain
    # OpenInference instrumentor 无冲突（不同层）；0.50b0 以下无 http.server.request.duration，
    # 需 0.50b0+ 才有新版 HTTP server metric（2026-09-03 OTLP metrics 补链路）
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.46.0",
]

[tool.uv.sources]
langchain-cubesandbox = { path = "../langchain-cubesandbox", editable = true }
